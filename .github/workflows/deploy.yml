name: CI/CD

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  # --------------------
  # 1️⃣ Build & Package
  # --------------------
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 코드 체크아웃
      - uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Gradle 설정
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Secrets → src/main/resources/application.yml 생성
      - name: Inject application.yml from Secret
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_PROPERTIES }}" > src/main/resources/application.yml

      # 5. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 6. 빌드 아티팩트 업로드
      - name: Upload JAR
        uses: actions/upload-artifact@v3
        with:
          name: built-jar
          path: build/libs/${{ secrets.JAR_NAME }}

  # --------------------
  # 2️⃣ Deploy to EC2
  # --------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 1. 아티팩트 다운로드
      - name: Download JAR
        uses: actions/download-artifact@v3
        with:
          name: built-jar
          path: build/libs

      # 2. JAR 존재 확인
      - name: Verify JAR exists
        run: |
          if [ ! -f build/libs/${{ secrets.JAR_NAME }} ]; then
            echo "Error: JAR file not found!"
            exit 1
          fi

      # 3. 빌드 아티팩트 EC2로 복사
      - name: Copy artifact to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: build/libs/${{ secrets.JAR_NAME }}
          target: ${{ secrets.APP_DIR }}
          port: 22

      # 4. EC2에 SSH 접속 후 앱 재시작
      - name: SSH and restart app
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 기존 앱 종료
            pkill -f 'java -jar' || echo "No running app found"

            # 배포 디렉토리 이동
            cd ${{ secrets.APP_DIR }}

            # 새 앱 실행
            nohup java -jar ${{ secrets.JAR_NAME }} > app.log 2>&1 &
