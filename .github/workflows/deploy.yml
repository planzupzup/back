name: CI/CD
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ] 

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  # --------------------
  # 1️⃣ Build & Package
  # --------------------
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
        
      # 2. JDK 21 설정 (캐시 포함)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          
      # 3. Gradle wrapper 실행 권한 부여
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      # 4. Secrets → src/main/resources/application.yml 생성
      - name: Create application.yml from secrets
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_PROPERTIES }}" > src/main/resources/application.yml
          
      # 5. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: ./gradlew clean build -x test
        
      # 6. 빌드 정보 확인
      - name: Display build info
        run: |
          echo "Built JAR: $(ls -la build/libs/)"
          echo "JAR size: $(du -h build/libs/${{ secrets.JAR_NAME }})"
          
      # 7. 빌드 아티팩트 업로드
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-jar-${{ github.sha }}
          path: build/libs/${{ secrets.JAR_NAME }}
          retention-days: 30

  # --------------------
  # 2️⃣ Deploy to EC2
  # --------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: 
      name: production
      url: http://${{ secrets.EC2_HOST }}
    steps:
      # 1. 아티팩트 다운로드
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: built-jar-${{ github.sha }}
          path: build/libs
          
      # 2. JAR 존재 및 크기 확인
      - name: Verify JAR file
        run: |
          if [ ! -f build/libs/${{ secrets.JAR_NAME }} ]; then
            echo "❌ Error: JAR file not found!"
            exit 1
          fi
          echo "✅ JAR file verified: $(ls -la build/libs/${{ secrets.JAR_NAME }})"
          
      # 3. 배포 스크립트 생성
      - name: Create deployment script
        run: |
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          JAR_NAME="${{ secrets.JAR_NAME }}"
          APP_DIR="${{ secrets.APP_DIR }}"
          BACKUP_DIR="$APP_DIR/backup"
          LOG_FILE="$APP_DIR/deploy.log"
          
          echo "$(date): Starting deployment..." >> "$LOG_FILE"
          
          # 백업 디렉토리 생성
          mkdir -p "$BACKUP_DIR"
          
          # 기존 JAR 백업 (있는 경우)
          if [ -f "$APP_DIR/build/libs/$JAR_NAME" ]; then
            echo "$(date): Backing up previous version..." >> "$LOG_FILE"
            cp "$APP_DIR/build/libs/$JAR_NAME" "$BACKUP_DIR/$JAR_NAME.$(date +%Y%m%d_%H%M%S)"
          fi
          
          # 기존 앱 종료 (graceful shutdown 시도)
          if pgrep -f "java -jar $JAR_NAME" > /dev/null; then
            echo "$(date): Stopping existing application..." >> "$LOG_FILE"
            pkill -TERM -f "java -jar $JAR_NAME" || true
            sleep 5
            # 강제 종료가 필요한 경우
            pkill -KILL -f "java -jar $JAR_NAME" || true
            sleep 2
          fi
          
          # 배포 디렉토리 이동
          cd "$APP_DIR/build/libs" || exit 1
          
          # 헬스체크 함수
          health_check() {
            for i in {1..30}; do
              if curl -f http://localhost:8080/actuator/health 2>/dev/null; then
                echo "$(date): Application is healthy!" >> "$LOG_FILE"
                return 0
              fi
              echo "$(date): Health check attempt $i/30..." >> "$LOG_FILE"
              sleep 2
            done
            return 1
          }
          
          # 애플리케이션 시작
          echo "$(date): Starting new application..." >> "$LOG_FILE"
          nohup java -jar \
            -Xmx512m \
            -Xms256m \
            -server \
            -Dspring.profiles.active=prod \
            "$JAR_NAME" > "$APP_DIR/app.log" 2>&1 &
          
          APP_PID=$!
          echo $APP_PID > "$APP_DIR/app.pid"
          sleep 3
          
          # 프로세스 확인
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "$(date): ❌ Application failed to start!" >> "$LOG_FILE"
            exit 1
          fi
          
          # 헬스체크
          if health_check; then
            echo "$(date): ✅ Deployment completed successfully!" >> "$LOG_FILE"
            exit 0
          else
            echo "$(date): ❌ Health check failed!" >> "$LOG_FILE"
            kill $APP_PID || true
            exit 1
          fi
          EOF
          chmod +x deploy.sh
          
      # 4. 빌드 아티팩트 EC2로 복사
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "build/libs/${{ secrets.JAR_NAME }},deploy.sh"
          target: ${{ secrets.APP_DIR }}
          
      # 5. EC2에 SSH 접속 후 배포 실행
      - name: Deploy application
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}
            chmod +x deploy.sh
            ./deploy.sh
            
      # 6. 배포 후 확인
      - name: Post-deployment verification
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
